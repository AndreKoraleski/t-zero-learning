name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      WANDB_MODE: disabled
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # matches the reference (cleanrl) environment
          cache: pip

      # CPU wheel first — the default PyPI torch bundles CUDA libraries
      # (multi-GB) that the GPU-less runner can't use anyway.
      - name: Install PyTorch (CPU)
        run: pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Fast tests (config & plumbing)
        run: pytest -m "not slow" -q

      - name: Smoke tests (tiny training runs on CPU)
        run: pytest -m slow -q
