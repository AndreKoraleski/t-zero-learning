# CleanRL benchmark — PPO on Humanoid-v4.
# Hyperparameters are the ppo_continuous_action.py defaults used in the CleanRL
# benchmark suite (1M steps, 1 env, CPU): https://docs.cleanrl.dev/rl-algorithms/ppo/
# Reference episodic return: 716.11 ± 49.08 (3 seeds). Note: 1M steps is far
# from convergence on Humanoid — this is a correctness benchmark, not a SOTA run.
#
# One deliberate change: CleanRL collects the 2048-step batch with a single env;
# here 4 async envs collect 512 steps each — same batch size and update math,
# much faster wall clock. Set num_envs=1, num_steps=2048 for an exact reproduction.

algorithm: ppo_continuous_action
env_id: Humanoid-v4
seed: 1
cuda: false            # CleanRL runs the MuJoCo benchmark on CPU (--no_cuda)
total_timesteps: 1000000
num_envs: 4

track: false           # set true (and fill .env) to log to Weights & Biases
capture_video: true
save_model: true

agent:
  activation: Tanh
  hidden_layers_size: 64
  use_obs_norm: true   # CleanRL normalizes observations (running mean/var);
                       # required to reproduce the benchmark numbers

ppo_continuous_action:
  learning_rate: 3.0e-4
  num_steps: 512       # 4 envs x 512 = 2048, CleanRL's batch size
  anneal_lr: true
  gamma: 0.99
  gae_lambda: 0.95
  num_minibatches: 32
  update_epochs: 10
  norm_adv: true
  clip_coef: 0.2
  clip_vloss: true
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: null
