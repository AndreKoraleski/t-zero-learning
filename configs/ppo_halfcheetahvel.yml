# Custom-env example — PPO on HalfCheetahVel-v1 (HalfCheetah rewarded for
# matching a target forward velocity). Demonstrates scalar env_kwargs.
# For the goal-switching variant see HalfCheetahVelGoal-v1, which takes the
# same schedule_mode/switch_step_range kwargs as AntDirGoal-v1 plus a
# velocity_pool (e.g. [0.25, 0.5, ..., 2.0]).

algorithm: ppo_continuous_action
env_id: HalfCheetahVel-v1
env_kwargs:
  target_vel: 0.5
seed: 1
torch_deterministic: true
cuda: true
total_timesteps: 50000000
num_envs: 32

track: false           # set true (and fill .env) to log to Weights & Biases
capture_video: true
video_every_global_steps: 5000000
video_length_seconds: 30.0
save_model: true

ppo_continuous_action:
  learning_rate: 3.0e-4
  num_steps: 1024
  anneal_lr: false
  gamma: 0.99
  gae_lambda: 0.95
  num_minibatches: 32
  update_epochs: 10
  norm_adv: true
  clip_coef: 0.2
  clip_vloss: true
  ent_coef: 0.005
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: null
