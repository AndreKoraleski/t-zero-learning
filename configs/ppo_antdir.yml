# Custom-env example — PPO on AntDir-v1 (Ant rewarded for running in a target direction).
# Demonstrates passing environment-specific arguments via env_kwargs.
# Long GPU run with vectorized envs; scale total_timesteps/num_envs down for a quick try.

algorithm: ppo_continuous_action
env_id: AntDir-v1
env_kwargs:
  target_dir: [-1.0, 1.0]   # planar direction vector the ant is rewarded to follow
seed: 1
torch_deterministic: true
cuda: true
total_timesteps: 30000000
num_envs: 32

track: false           # set true (and fill .env) to log to Weights & Biases
capture_video: true
video_every_global_steps: 5000000
video_length_seconds: 30.0
save_model: true

ppo_continuous_action:
  learning_rate: 3.0e-4
  num_steps: 1024
  anneal_lr: false
  gamma: 0.99
  gae_lambda: 0.95
  num_minibatches: 32
  update_epochs: 10
  norm_adv: true
  clip_coef: 0.2
  clip_vloss: true
  ent_coef: 0.005
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: null
